<style>

          background:radial-gradient(ellipse at 50% 40%, #f6efe0 0%, #e7dcc6 70%, #d9ccb2 100%); transition:opacity 1.6s ease; z-index:10; }
  #veil h1 { margin:0; font-weight:400; font-size:44px; letter-spacing:.18em; }
  #veil p { margin:0; font-size:14px; letter-spacing:.2em; opacity:.65; }

  #bar i { display:block; height:100%; width:0%; background:#9b6b43; transition:width .3s; }
  #title { position:fixed; left:clamp(16px,3vw,36px); bottom:clamp(16px,3vh,32px); pointer-events:none; z-index:2;
           text-shadow:0 1px 12px rgba(255,248,235,.7); }
  #title b { display:block; font-weight:400; font-size:clamp(26px,3.2vw,40px); letter-spacing:.16em; }
  #title span { display:block; margin-top:4px; font-size:clamp(11px,1vw,13px); letter-spacing:.22em; opacity:.72; }
  #ui { position:fixed; right:clamp(16px,2.4vw,30px); bottom:clamp(16px,3vh,30px); display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; z-index:2; }
  #ui button { font:inherit; font-size:13px; letter-spacing:.08em; color:var(--ink); background:var(--paper); border:1px solid var(--line);
               padding:8px 14px; border-radius:999px; cursor:pointer; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); transition:background .2s; }
  #ui button:hover { background:rgba(255,251,242,.95); }
  #ui button.on { background:#8a5a36; color:#fbf3e4; border-color:#8a5a36; }
  #hint { position:fixed; right:clamp(16px,2.4vw,30px); bottom:calc(clamp(16px,3vh,30px) + 44px); font-size:12px; letter-spacing:.08em; opacity:.6;
          text-shadow:0 1px 8px rgba(255,248,235,.9); pointer-events:none; z-index:2; transition:opacity 1s; }
  .hide #title, .hide #ui, .hide #hint { opacity:0; pointer-events:none; }
  @media (max-width:600px){ #hint{display:none} #ui button{padding:7px 11px;font-size:12px} }
</style>

{ "imports": {

  <button id="bHome" title="기본 시점 (R)">기본 시점</button>
  <button id="bTour" title="천천히 둘러보기 (C)">전시 카메라</button>
  <button id="bFull" title="전체 화면 (F)">전체 화면</button>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* =====================================================================
   0. small utilities
   ===================================================================== */
const V3 = THREE.Vector3;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (e0, e1, x) => { const t = clamp((x - e0) / (e1 - e0), 0, 1); return t * t * (3 - 2 * t); };
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let R = mulberry32(20261124);
const rnd = (a = 0, b = 1) => a + (b - a) * R();
const pick = (a) => a[Math.floor(R() * a.length)];
function hash(ix, iy, s) { let h = Math.imul(ix | 0, 374761393) ^ Math.imul(iy | 0, 668265263) ^ Math.imul((s | 0) + 1013, 1442695041); h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }
function noise2(x, y, s = 0, px = 0, py = 0) {
  let xi = Math.floor(x), yi = Math.floor(y); const xf = x - xi, yf = y - yi; let x1 = xi + 1, y1 = yi + 1;
  if (px) { xi = ((xi % px) + px) % px; x1 = ((x1 % px) + px) % px; }
  if (py) { yi = ((yi % py) + py) % py; y1 = ((y1 % py) + py) % py; }
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi, s), b = hash(x1, yi, s), c = hash(xi, y1, s), d = hash(x1, y1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;

function fbm(x, y, oct = 4, s = 0, px = 0, py = 0) {
  let sum = 0, amp = 0.5, f = 1, n = 0;
  for (let i = 0; i < oct; i++) { sum += amp * noise2(x * f, y * f, s + i * 31, px * f, py * f); n += amp; amp *= 0.5; f *= 2; }
  return sum / n;
}
const loadBar = document.querySelector('#bar i');
const step = async (p) => { loadBar.style.width = (p * 100).toFixed(0) + '%'; await new Promise(r => setTimeout(r, 0)); };

/* =====================================================================
   1. renderer, scene, camera
   ===================================================================== */
const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
const DPR = Math.min(window.devicePixelRatio || 1, 1.5);
renderer.setPixelRatio(DPR);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;
renderer.info.autoReset = false;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);
const maxAniso = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const scene = new THREE.Scene();
const FOG = new THREE.Color('#bdd6dc');
scene.fog = new THREE.FogExp2(FOG, 0.00088);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.25, 6000);
camera.layers.enable(1);

const SUN_DIR = new V3(0.80, 0.50, 0.18).normalize();
const SUN_COLOR = new THREE.Color('#ffe2b8');
const WATER_Y = -2.6;
const DIRT = { x0: -110, x1: 13.2, z0: -80, z1: 100 };
const uTime = { value: 0 };
const uWind = { value: new THREE.Vector2(1, 0.35) };
const uPointScale = { value: innerHeight * Math.min(window.devicePixelRatio || 1, 1.5) * 0.5 };

/* =====================================================================
   2. procedural textures (canvas)
   ===================================================================== */
function mkCanvas(w, h = w) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
function toTex(c, srgb = true, rep = true) {
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = srgb ? THREE.SRGBColorSpace : THREE.NoColorSpace;
  if (rep) t.wrapS = t.wrapT = THREE.RepeatWrapping;
  t.anisotropy = maxAniso; t.needsUpdate = true; return t;
}
function pixels(c, fn) {
  const ctx = c.getContext('2d'), w = c.width, h = c.height, img = ctx.getImageData(0, 0, w, h), d = img.data;
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { const k = (j * w + i) * 4; fn(i, j, d, k); }
  ctx.putImageData(img, 0, 0);
}
function heightToNormal(hc, strength = 2) {
  const w = hc.width, h = hc.height, src = hc.getContext('2d').getImageData(0, 0, w, h).data;
  const out = mkCanvas(w, h), ctx = out.getContext('2d'), img = ctx.createImageData(w, h), d = img.data;
  const H = (x, y) => src[((((y + h) % h) * w) + ((x + w) % w)) * 4] / 255;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const dx = (H(x + 1, y) - H(x - 1, y)) * strength, dy = (H(x, y + 1) - H(x, y - 1)) * strength;
    let nx = -dx, ny = dy, nz = 1; const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;
    const k = (y * w + x) * 4; d[k] = (nx * .5 + .5) * 255; d[k + 1] = (ny * .5 + .5) * 255; d[k + 2] = (nz * .5 + .5) * 255; d[k + 3] = 255;
  }
  ctx.putImageData(img, 0, 0); return toTex(out, false);
}
function blurCanvas(c, px) { const o = mkCanvas(c.width, c.height), x = o.getContext('2d'); x.filter = `blur(${px}px)`;
  // draw 3x3 tiled to keep wrap
  for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) x.drawImage(c, a * c.width, b * c.height); return o; }
const rgb = (r, g, b) => `rgb(${r | 0},${g | 0},${b | 0})`;
function jitterColor(hex, amt) { const c = new THREE.Color(hex); const hsl = {}; c.getHSL(hsl);
  c.setHSL(hsl.h + (R() - .5) * amt * .08, clamp(hsl.s + (R() - .5) * amt * .3, 0, 1), clamp(hsl.l + (R() - .5) * amt * .25, 0, 1)); return '#' + c.getHexString(); }

// --- plaster walls (neutral warm, tinted by material colour) ---
function texPlaster() {
  const S = 512, c = mkCanvas(S), hc = mkCanvas(S);
  const hx = hc.getContext('2d'); hx.fillStyle = '#808080'; hx.fillRect(0, 0, S, S);
  const hd = hx.getImageData(0, 0, S, S);
  pixels(c, (i, j, d, k) => {
    const n1 = fbm(i / 128, j / 128, 4, 3, 4, 4), n2 = fbm(i / 16, j / 16, 3, 5, 32, 32), n3 = noise2(i / 3, j / 3, 9, 171, 171);
    const st = fbm(i / 32, j / 256, 3, 11, 16, 2);
    let v = 0.93 + (n1 - .5) * .22 + (n2 - .5) * .09 + (n3 - .5) * .05 - Math.max(0, st - .58) * .35;
    const warm = (n1 - .5) * 10;
    d[k] = clamp(246 * v + warm, 0, 255); d[k + 1] = clamp(240 * v, 0, 255); d[k + 2] = clamp(230 * v - warm, 0, 255); d[k + 3] = 255;
    const hv = 128 + (n2 - .5) * 90 + (n3 - .5) * 40; hd.data[k] = hd.data[k + 1] = hd.data[k + 2] = hv;
  });
  hx.putImageData(hd, 0, 0);
  return { map: toTex(c), normalMap: heightToNormal(hc, 1.2) };
}

// --- ashlar stone ---
function texStone(seed = 1, warm = 0) {
  R = mulberry32(seed * 977);
  const S = 512, c = mkCanvas(S), hc = mkCanvas(S), x = c.getContext('2d'), hx = hc.getContext('2d');
  x.fillStyle = '#6d6356'; x.fillRect(0, 0, S, S); hx.fillStyle = '#000'; hx.fillRect(0, 0, S, S);
  const pal = warm ? ['#c9b796', '#bba98a', '#d2c1a0', '#b3a48c', '#c6ae8c', '#a99d88'] : ['#b9b0a2', '#a9a295', '#c3b8a5', '#9f998f', '#b6a891', '#aea79c', '#c0b29b'];
  let rows = []; let tot = 0; while (tot < S - 30) { const h = rnd(36, 64); rows.push(h); tot += h; }
  const sc = S / tot; rows = rows.map(h => h * sc);
  let y = 0;
  for (const h of rows) {
    let xx = rnd(0, 60); const start = xx;
    while (xx < start + S) {
      const w = Math.min(rnd(50, 130), start + S - xx); if (w < 18) break;
      const col = jitterColor(pick(pal), 1);
      for (const ox of [-S, 0, S]) {
        const r = rnd(4, 9);
        x.fillStyle = col; x.beginPath(); x.roundRect(xx + ox + 2.5, y + 2.5, w - 5, h - 5, r); x.fill();
        hx.fillStyle = '#fff'; hx.beginPath(); hx.roundRect(xx + ox + 3, y + 3, w - 6, h - 6, r + 2); hx.fill();
      }
      xx += w;
    }
    y += h;
  }
  const hb = blurCanvas(hc, 3);
  const hd = hb.getContext('2d').getImageData(0, 0, S, S).data;
  pixels(c, (i, j, d, k) => {
    const n = fbm(i / 32, j / 32, 4, 21, 16, 16), m = noise2(i / 4, j / 4, 7, 128, 128), hv = hd[k] / 255;
    const ao = 0.62 + 0.38 * smooth(0.05, 0.6, hv);
    const v = ao * (0.88 + (n - .5) * .32 + (m - .5) * .1);
    const moss = smooth(0.62, 0.78, fbm(i / 64, j / 64, 3, 41, 8, 8)) * (1 - hv) * .9;
    d[k] = lerp(d[k] * v, 92, moss * .5); d[k + 1] = lerp(d[k + 1] * v, 110, moss * .5); d[k + 2] = lerp(d[k + 2] * v, 62, moss * .5);
  });

  const hc2 = mkCanvas(S); const h2 = hc2.getContext('2d'); h2.drawImage(hb, 0, 0);
  pixels(hc2, (i, j, d, k) => { const g = d[k] * 0.85 + noise2(i / 3, j / 3, 77, 171, 171) * 38; d[k] = d[k + 1] = d[k + 2] = g; });
  R = mulberry32(20261124 + seed);
  return { map: toTex(c), normalMap: heightToNormal(hc2, 3.2) };
}

// --- roof tiles: kind 'tile' (barrel) or 'scale' (fish-scale shingles) ---
function texRoof(kind = 'tile', seed = 3) {
  R = mulberry32(seed * 131);
  const S = 512, c = mkCanvas(S), hc = mkCanvas(S), x = c.getContext('2d'), hx = hc.getContext('2d');
  const cols = kind === 'tile' ? 8 : 10, rowsN = kind === 'tile' ? 11 : 14;
  const tw = S / cols, th = S / rowsN;
  x.fillStyle = '#3c3430'; x.fillRect(0, 0, S, S); hx.fillStyle = '#000'; hx.fillRect(0, 0, S, S);
  // draw from bottom row (low on roof) upwards; upper tiles overlap lower ones
  for (let r = rowsN; r >= -1; r--) {
    const y0 = r * th - th * 0.5, off = (r % 2) * tw * 0.5;
    for (let ci = -1; ci <= cols; ci++) {
      const x0 = ci * tw + off + rnd(-1.5, 1.5), ww = tw - 1.5, hh = th * 1.55;
      const tone = 0.84 + rnd(0, 0.2), tint = rnd(-8, 8), moss = R() < 0.05;
      for (const oy of [0, S]) for (const ox of [0]) {
        const yy = y0 + oy - S * (oy ? 1 : 0) * 0; // (kept simple; vertical wrap handled by drawing rows -1..rowsN)
        // shadow cast onto the lower tile
        x.save(); x.filter = 'blur(3px)'; x.fillStyle = 'rgba(20,10,5,.45)';
        tilePath(x, x0 + ox + 1, yy + 4, ww, hh, kind); x.fill(); x.restore();
        const g = x.createLinearGradient(x0, 0, x0 + ww, 0);
        const base = moss ? [150, 160, 120] : [226 * tone + tint, 214 * tone, 204 * tone - tint];
        if (kind === 'tile') { g.addColorStop(0, rgb(base[0] * .72, base[1] * .72, base[2] * .74)); g.addColorStop(.45, rgb(...base)); g.addColorStop(1, rgb(base[0] * .66, base[1] * .66, base[2] * .68)); }
        else { g.addColorStop(0, rgb(base[0] * .9, base[1] * .9, base[2] * .92)); g.addColorStop(1, rgb(base[0] * .8, base[1] * .8, base[2] * .82)); }
        x.fillStyle = g; tilePath(x, x0 + ox, yy, ww, hh, kind); x.fill();
        // lighter lip at the lower edge
        x.strokeStyle = 'rgba(255,248,235,.18)'; x.lineWidth = 2; tilePath(x, x0 + ox + 1, yy - 1, ww - 2, hh, kind, true); x.stroke();
        const hg = hx.createLinearGradient(0, yy, 0, yy + hh); hg.addColorStop(0, '#222'); hg.addColorStop(1, '#fff');
        hx.fillStyle = hg; tilePath(hx, x0 + ox, yy, ww, hh, kind); hx.fill();
      }
    }
  }
  pixels(c, (i, j, d, k) => { const n = fbm(i / 32, j / 32, 4, 51, 16, 16), m = noise2(i / 3, j / 3, 5, 171, 171); const v = 0.86 + (n - .5) * .35 + (m - .5) * .08;
    const lich = smooth(0.66, 0.8, fbm(i / 48, j / 48, 3, 61, 10.666, 10.666)); d[k] = lerp(d[k] * v, 170, lich * .35); d[k + 1] = lerp(d[k + 1] * v, 172, lich * .35); d[k + 2] = lerp(d[k + 2] * v, 120, lich * .35); });
  R = mulberry32(20261124 + seed);
  return { map: toTex(c), normalMap: heightToNormal(blurCanvas(hc, 1), 3.5) };
}
function tilePath(x, x0, y0, w, h, kind, lipOnly = false) {
  x.beginPath();
  if (kind === 'tile') {
    const r = w * 0.48;
    if (!lipOnly) { x.moveTo(x0, y0); x.lineTo(x0 + w, y0); x.lineTo(x0 + w, y0 + h - r * .5); }
    else x.moveTo(x0 + w, y0 + h - r * .5);
    x.quadraticCurveTo(x0 + w * 0.5, y0 + h + r * .35, x0, y0 + h - r * .5);
    if (!lipOnly) x.closePath();
  } else {
    if (!lipOnly) { x.moveTo(x0, y0); x.lineTo(x0 + w, y0); x.lineTo(x0 + w, y0 + h * .45); }
    else x.moveTo(x0 + w, y0 + h * .45);
    x.bezierCurveTo(x0 + w, y0 + h * 1.05, x0, y0 + h * 1.05, x0, y0 + h * .45);
    if (!lipOnly) x.closePath();
  }
}

// --- cobbles / setts laid in rows along the road (u across, v along) ---
function texCobble(seed = 5, big = false) {
  R = mulberry32(seed * 71);
  const S = 1024, c = mkCanvas(S), hc = mkCanvas(S), x = c.getContext('2d'), hx = hc.getContext('2d');
  x.fillStyle = '#6a5c4a'; x.fillRect(0, 0, S, S); hx.fillStyle = '#000'; hx.fillRect(0, 0, S, S);
  const pal = ['#b9ad9b', '#a89c8a', '#c4b59f', '#9e9586', '#b4a38e', '#c2ab92', '#a5a39a', '#bfb3a3', '#ad9a85'];
  const rowH = big ? 70 : 44; const nRows = Math.round(S / rowH), rh = S / nRows;
  for (let r = 0; r < nRows; r++) {
    let xx = rnd(0, 40); const start = xx;
    while (xx < start + S) {
      const w = rnd(rh * 0.85, rh * 1.6); const col = jitterColor(pick(pal), 1.2);
      const cx = xx + w / 2 + rnd(-2, 2), cy = r * rh + rh / 2 + rnd(-2.5, 2.5), rot = rnd(-0.12, 0.12);
      for (const ox of [-S, 0, S]) for (const oy of [-S, 0, S]) {
        if (Math.abs(cx + ox - S / 2) > S / 2 + w || Math.abs(cy + oy - S / 2) > S / 2 + rh) continue;
        x.save(); x.translate(cx + ox, cy + oy); x.rotate(rot); x.fillStyle = col; x.beginPath(); x.roundRect(-w / 2 + 3, -rh / 2 + 3, w - 6, rh - 6, rh * 0.32); x.fill(); x.restore();
        hx.save(); hx.translate(cx + ox, cy + oy); hx.rotate(rot); hx.fillStyle = '#fff'; hx.beginPath(); hx.roundRect(-w / 2 + 4, -rh / 2 + 4, w - 8, rh - 8, rh * 0.36); hx.fill(); hx.restore();
      }
      xx += w;
    }
  }
  const hb = blurCanvas(hc, big ? 5 : 4), hd = hb.getContext('2d').getImageData(0, 0, S, S).data;
  pixels(c, (i, j, d, k) => {
    const hv = hd[k] / 255, n = fbm(i / 64, j / 64, 4, 3, 16, 16), m = noise2(i / 5, j / 5, 8, 204.8, 204.8);
    const ao = 0.55 + 0.45 * smooth(0.0, 0.55, hv); const v = ao * (0.9 + (n - .5) * .3 + (m - .5) * .1);
    const gap = 1 - smooth(0.05, 0.35, hv); const g = fbm(i / 24, j / 24, 3, 9, 42.666, 42.666);
    const mossy = gap * smooth(0.48, 0.62, g); // moss / tiny grass in joints
    let r = d[k] * v, gg = d[k + 1] * v, b = d[k + 2] * v;
    r = lerp(r, 88, mossy * .8); gg = lerp(gg, 112, mossy * .8); b = lerp(b, 52, mossy * .8);
    d[k] = r; d[k + 1] = gg; d[k + 2] = b;
  });
  const hc2 = mkCanvas(S); hc2.getContext('2d').drawImage(hb, 0, 0);
  pixels(hc2, (i, j, d, k) => { const g = d[k] * .9 + noise2(i / 4, j / 4, 3, 256, 256) * 26; d[k] = d[k + 1] = d[k + 2] = g; });
  R = mulberry32(20261124 + seed);
  return { map: toTex(c), normalMap: heightToNormal(hc2, 4) };
}

// --- flagstones (guillotine split => tileable) ---
function texFlag(seed = 9) {
  R = mulberry32(seed * 19);
  const S = 1024, c = mkCanvas(S), hc = mkCanvas(S), x = c.getContext('2d'), hx = hc.getContext('2d');
  x.fillStyle = '#7b6e5c'; x.fillRect(0, 0, S, S); hx.fillStyle = '#000'; hx.fillRect(0, 0, S, S);
  const pal = ['#d3c6ae', '#c8b9a0', '#dccdb2', '#bfb3a0', '#cbbda6', '#d6c4a4', '#c2b8a9'];
  const rects = [];
  (function split(x0, y0, w, h, dpt) {

    if (nx > .5) uv.setXY(i, z / ts, y / ts); else if (ny > .5) uv.setXY(i, x / ts, z / ts); else uv.setXY(i, x / ts, y / ts);

}

// a slab whose top surface is y=f(x,z) over a rectangle, with thickness t (used for curved roofs)

function riverBanks(z) {

}
function landY(x, z) {

  // flat village core

  // hills on far left

}

}
// village floor height (terrain, plus the road and terrace treatments)
const groundY = (x, z) => terrainY(x, z);

    sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vWp;').replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvWp = (modelMatrix*vec4(transformed,1.)).xyz;');

        vec2 duv = (vWp.xz - vec2(${gx0.toFixed(1)}, ${gz0.toFixed(1)})) / vec2(${(gx1 - gx0).toFixed(1)}, ${(gz1 - gz0).toFixed(1)});

const PEAKS = [[-190, -600, 70, 210], [-60, -470, 40, 120], [170, -720, 95, 260], [380, -540, 70, 190], [-420, -460, 60, 200], [10, -900, 120, 300], [580, -660, 95, 240], [-640, -700, 100, 260], [320, -980, 130, 320], [-320, -900, 110, 280]];
const CASTLE = { x: 62, z: -352 };
function mountainY(x, z) {

  for (const [px, pz, ph, pr] of PEAKS) { const d2 = ((x - px) ** 2 + (z - pz) ** 2) / (pr * pr); h += ph * Math.exp(-d2 * 1.4); }

    uniforms: { sunDir: { value: SUN_DIR }, time: uTime, zen: { value: new THREE.Color('#3f86d8') }, mid: { value: new THREE.Color('#8fc0ec') }, hor: { value: new THREE.Color('#d9eae6') }, glow: { value: new THREE.Color('#fff0d2') } },

}
const clouds = [];
function buildClouds() {
  const specs = [[-22, 13, 2600, 1700], [12, 12.5, 2800, 2100], [36, 15, 2500, 1500], [58, 12, 2600, 1800], [-52, 16, 2700, 1300], [82, 13, 2600, 1500], [-2, 20, 3000, 1200], [24, 22, 3100, 1100]];

  const zs = []; for (let z = 90; z >= -268; z -= 2) zs.push(z);
  const across = 24, pos = [], uv = [], idx = [], wid = [];
  zs.forEach((z, j) => { const [xl, xr] = riverBanks(z); for (let i = 0; i <= across; i++) { const t = i / across; const x = lerp(xl - 2, xr + 3, t); pos.push(x, WATER_Y, z); uv.push(x - xl, -z); wid.push(xr - xl); } });

      deep: { value: new THREE.Color('#2f7d86') }, shallow: { value: new THREE.Color('#6fb2a2') }, skyCol: { value: new THREE.Color('#a8cce6') },
      fogColor: { value: FOG }, fogDensity: { value: scene.fog.density }, boats: { value: boatsU }
    },
    vertexShader: `
      attribute float width; uniform mat4 texMat; varying vec3 vW; varying vec2 vUv; varying vec4 vR; varying float vWid;
      void main(){ vec4 w = modelMatrix*vec4(position,1.); vW=w.xyz; vUv=uv; vWid=width; vR = texMat*w; gl_Position = projectionMatrix*viewMatrix*w; }`,
    fragmentShader: `
      uniform float time, fogDensity; uniform sampler2D tRefl; uniform vec3 sunDir, sunCol, deep, shallow, skyCol, fogColor; uniform vec4 boats[6];
      varying vec3 vW; varying vec2 vUv; varying vec4 vR; varying float vWid;
      vec2 hash22(vec2 p){ p = vec2(dot(p,vec2(127.1,311.7)), dot(p,vec2(269.5,183.3))); return -1.+2.*fract(sin(p)*43758.5453); }

function buildViaduct() {

/* =====================================================================
   99. controls, UI, loop
   ===================================================================== */
const HOME = { pos: new V3(-2.5, 7.2, 48), tgt: new V3(9.0, 6.2, -9) };
let controls;
function setupControls() {

  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.copy(HOME.tgt); controls.enableDamping = true; controls.dampingFactor = 0.06;
  controls.minDistance = 4; controls.maxDistance = 140; controls.maxPolarAngle = Math.PI * 0.495; controls.rotateSpeed = 0.55; controls.zoomSpeed = 0.8; controls.panSpeed = 0.7;

let tween = null, tour = false, tourT = 0;

const TOUR_P = new THREE.CatmullRomCurve3([new V3(-2.5, 7.2, 48), new V3(5, 5.2, 44), new V3(9.5, 3.4, 36), new V3(10.5, 5.5, 18), new V3(6, 9, 4), new V3(-1, 11, 20), new V3(-2, 5, 32), new V3(-4.5, 6.8, 46)], true, 'centripetal');
const TOUR_T = new THREE.CatmullRomCurve3([new V3(9, 6.2, -9), new V3(14, 3.5, 10), new V3(14, 1.2, 24), new V3(30, 4, -20), new V3(-4, 8, -16), new V3(-6, 4, 8), new V3(-6, 4.5, 14), new V3(6, 6, -10)], true, 'centripetal');

    const p = TOUR_P.getPoint(u), t = TOUR_T.getPoint(u);

const updaters = [];
const clock = new THREE.Clock();

let frame = 0, fpsAcc = 0, fpsN = 0; const lastStats = {};
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05); uTime.value += dt; frame++;
  animateCamera(dt); controls.update();
  for (const u of updaters) u(uTime.value, dt);
  for (const a of anim) a(uTime.value, dt);
  if (windmillSails) windmillSails.rotation.z = -uTime.value * 0.35;
  for (const f of FLAGS) f.rotation.y = Math.sin(uTime.value * 1.7 + f.position.x) * 0.35;
  for (const c of clouds) { c.userData.az += c.userData.speed * dt * 0.05; const { az, el, dist } = c.userData; c.position.x = Math.cos(az) * Math.cos(el) * dist; c.position.z = Math.sin(az) * Math.cos(el) * dist; c.lookAt(0, c.position.y * .6, 0); }

  renderer.info.reset(); renderer.shadowMap.needsUpdate = (frame % 2 === 1) || frame < 3;

async function main() {
  await step(.05); initMaterials(); buildDirtTex();
  await step(.25); buildSky(); buildClouds(); buildLights(); buildEnvironment();
  await step(.35); buildTerrain(); buildWater();
  await step(.45); if (typeof buildWorld === 'function') await buildWorld();
  await step(.9); const calls = mergeStatic(staticRoot);
  buildPost(); postScene.add(post); setupControls(); setupUI(); onResize();
  window.__dbg = { boats, scene, water: () => water, terrain: () => terrainMesh, sun: () => sun, THREE, renderer, camera };
  window.__setCam = (p, t) => { tween = null; tour = false; camera.position.set(...p); controls.target.set(...t); controls.update(); };
  window.__info = () => ({ ...lastStats, merged: calls, geos: renderer.info.memory.geometries, tex: renderer.info.memory.textures });
  await step(1);
