<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#7fb069" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="정령의 골짜기" />
    <meta name="description" content="그림 같은 골짜기에서 재료를 모으고, 정령과 동물을 만나고, 내 땅에 캠핑장을 짓는 느긋한 생활 게임" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>정령의 골짜기</title>
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #dfeaf0;
        color: #24323a;
        font: 15px/1.4 'Noto Serif KR', 'Nanum Myeongjo', 'Apple SD Gothic Neo', 'Malgun Gothic', Georgia, serif;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        overscroll-behavior: none;
        position: fixed;
        inset: 0;
      }
      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      #loading,
      #start {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        letter-spacing: 0.06em;
        pointer-events: none;
      }
      #loading {
        background: #dfeaf0;
      }
      #start {
        display: none;
        align-content: end;
        padding-bottom: 9vh;
        color: #fff;
        text-shadow: 0 1px 10px rgba(20, 50, 80, 0.55);
      }
      #start b {
        display: block;
        font-size: 19px;
        font-weight: normal;
      }
      #start span {
        display: block;
        margin-top: 4px;
        font-size: 13px;
        opacity: 0.85;
        text-align: center;
      }
      #note {
        position: fixed;
        top: 7vh;
        left: 0;
        right: 0;
        text-align: center;
        font-size: 19px;
        letter-spacing: 0.06em;
        color: #fff;
        text-shadow: 0 1px 10px rgba(20, 50, 80, 0.55);
        opacity: 0;
        transition: opacity 0.6s;
        pointer-events: none;
      }
      #note.on {
        opacity: 1;
        transition: opacity 0.15s;
      }
      .ready:not(.playing) #start {
        display: grid;
      }
      #start .thumb,
      .touch #start .mouse {
        display: none;
      }
      .touch #start .thumb {
        display: block;
      }
      #loading {
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="start">
      <div>
        <b class="mouse">화면을 클릭하면 시작해요</b>
        <span class="mouse">W A S D 걷기 · E 줍기·말 걸기 · B 짓기 · Tab 정령 · M 지도 · H 도움말</span>
        <b class="thumb">화면을 터치하면 시작해요</b>
        <span class="thumb">왼쪽 엄지로 걷기 · 오른쪽을 끌어 둘러보기 · ✋ 줍기·말 걸기</span>
      </div>
    </div>
    <div id="note"></div>
    <div id="loading">정령의 골짜기</div>
    <script type="module" src="./src/valley/main.js"></script>
  </body>
</html>
